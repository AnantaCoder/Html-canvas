<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Rainy Day Storm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <canvas id="myCanvas" width="800" height="800"></canvas>
        
        <!-- Minimalist Toggle Button -->
        <button id="panelToggleBtn" class="panel-toggle-btn" title="Toggle Controls">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
        
        <!-- Control Panel overlay -->
        <div id="controlPanel" class="control-panel hidden">
            <!-- Digital clock & date info when open -->
            <div id="panelClock" class="panel-clock">12:00:00 - Jan 1</div>

            <h3 class="panel-title">Ambient Controls</h3>
            
            <div class="control-group">
                <label for="musicSelect">Ambient Music</label>
                <select id="musicSelect" class="panel-select">
                    <option value="none">None</option>
                    <option value="lofi">Cozy Lofi Chords</option>
                    <option value="meditation">Meditation Drone</option>
                    <option value="piano">Mellow Piano Melody</option>
                    <option value="chimes">Wind Chimes</option>
                    <option value="synthwave">Cosmic Synthwave</option>
                    <option value="fireplace">Cozy Fireplace Crackle</option>
                    <option value="flute">Ethereal Flute</option>
                    <option value="techno">Minimal Techno Beat</option>
                </select>
                <div class="github-link-row">
                    <a href="https://github.com/anantacoder" target="_blank" rel="noopener noreferrer" class="github-link" title="AnantaCoder GitHub">
                        <svg class="github-icon" viewBox="0 0 24 24" width="16" height="16">
                            <path fill="currentColor" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482C19.138 20.193 22 16.44 22 12.017 22 6.484 17.522 2 12 2z"/>
                        </svg>
                    </a>
                </div>
            </div>

            <div class="control-group">
                <label for="musicVol">Music Volume</label>
                <div class="slider-container">
                    <input type="range" id="musicVol" min="0" max="1" step="0.05" value="0.7">
                    <span id="musicVolVal">70%</span>
                </div>
            </div>
            
            <div class="control-group">
                <label for="rainVol">Rain Volume</label>
                <div class="slider-container">
                    <input type="range" id="rainVol" min="0" max="1" step="0.05" value="0.3">
                    <span id="rainVolVal">30%</span>
                </div>
            </div>
            
            <div class="control-group">
                <label for="thunderVol">Thunder Volume</label>
                <div class="slider-container">
                    <input type="range" id="thunderVol" min="0" max="1" step="0.05" value="0.7">
                    <span id="thunderVolVal">70%</span>
                </div>
            </div>
            
            <div class="control-group">
                <label for="thunderFreq">Thunder Frequency</label>
                <div class="slider-container">
                    <input type="range" id="thunderFreq" min="10" max="600" step="10" value="15">
                    <span id="thunderFreqVal">15s</span>
                </div>
            </div>

            <div class="control-group switch-group">
                <label for="enableThunder">Auto Thunder</label>
                <label class="switch">
                    <input type="checkbox" id="enableThunder" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <button id="triggerLightningBtn" class="trigger-btn">⚡ Manual Strike</button>
            <button id="fullscreenBtn" class="trigger-btn" style="margin-top: 8px;">🖥️ Fullscreen</button>
        </div>
        
        <!-- Bottom Left Clock -->
        <div id="bottomLeftClock" class="bottom-left-clock"></div>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
